name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev deps
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev deps
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"
      - run: mypy packages/shared/lexscribe_shared packages/retrieval/lexscribe_retrieval

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"
      - name: Unit tests with coverage
        run: |
          pytest -m "not integration and not contract" \
            --cov=lexscribe_shared --cov=lexscribe_retrieval --cov=lexscribe_eval \
            --cov=lexscribe_api --cov=lexscribe_worker \
            --cov-report=term --cov-report=xml \
            --cov-fail-under=75 -q

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"
      - run: pytest -m contract -q

  eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"
      - name: Run 5-question subset with FakeProvider
        run: |
          mkdir -p runs
          lexscribe eval run --suite mna_v1 --provider fake --limit 5 \
            --output runs/ci-smoke.json

  tampered-chunk-eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"
      - name: Run tampered-chunk verify gate
        run: pytest tests/test_tampered_chunk_eval.py -v

  bench-regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]"
      - name: Run small-scale bench
        run: |
          mkdir -p bench/results
          python bench/bench.py --scale small --seed 1 \
            --results-dir bench/results
      - name: Compare against committed baseline (30% drift threshold)
        run: |
          NEW=$(ls -t bench/results/*_small.json | head -1)
          python bench/regress.py \
            --baseline bench/results/baseline_small.json \
            --new "$NEW" \
            --threshold 0.30

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: ghcr.io/say-5/lexscribe-api:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          tags: ghcr.io/say-5/lexscribe-worker:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
