[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexscribe"
version = "0.1.0"
description = "Hybrid-RAG diligence copilot for M&A contracts with span-level citations and eval-driven quality gates"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Sai Asish Y"}]
keywords = ["rag", "pgvector", "fastapi", "celery", "eval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.32,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<0.5",
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<6",
    "boto3>=1.35,<2",
    "httpx>=0.27,<0.29",
    "structlog>=24.4,<26",
    "click>=8.1,<9",
    "PyYAML>=6.0,<7",
    "tenacity>=9.0,<10",
    "numpy>=1.26,<3",
    "python-multipart>=0.0.9,<0.1",
    "rank-bm25>=0.2.2,<0.3",
    # Observability
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1",
    "opentelemetry-instrumentation-celery>=0.48b0,<1",
    "opentelemetry-instrumentation-httpx>=0.48b0,<1",
    "prometheus-client>=0.21,<0.30",
]

[project.optional-dependencies]
parse = [
    "pdfplumber>=0.11,<0.12",
    "unstructured>=0.15,<0.20",
    "pypdf>=5.0,<6",
]
dev = [
    "ruff>=0.7,<0.10",
    "black>=24.10,<26",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<8",
    "pytest-httpx>=0.32,<1",
    "factory-boy>=3.3,<4",
    "schemathesis>=3.36,<4",
    "respx>=0.21,<1",
    "faker>=30,<40",
    "types-PyYAML",
    "types-redis",
    "pre-commit>=3.8,<5",
]

[project.scripts]
lexscribe = "lexscribe_eval.cli:cli"
lexscribe-worker = "lexscribe_worker.cli:cli"

[project.urls]
Homepage = "https://github.com/SAY-5/lexscribe"
Repository = "https://github.com/SAY-5/lexscribe"

[tool.setuptools.packages.find]
where = ["packages/shared", "packages/retrieval", "packages/eval", "packages/clients/python", "services/api", "services/ingest-worker"]
include = ["lexscribe_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions", "packages/clients/python/lexscribe_client/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "TID", "RUF"]
ignore = [
    "E501",  # line length handled by black
    "B008",  # FastAPI uses Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF001"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "alembic/versions"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lexscribe_shared.*", "lexscribe_retrieval.*"]
strict = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["tests.*", "alembic.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests", "bench"]
asyncio_mode = "auto"
markers = [
    "integration: requires postgres/redis/minio (gate with RUN_INTEGRATION=1)",
    "contract: schemathesis OpenAPI contract tests",
    "slow: slow tests excluded from default run",
]
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["lexscribe_shared", "lexscribe_retrieval", "lexscribe_eval", "lexscribe_api", "lexscribe_worker"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
